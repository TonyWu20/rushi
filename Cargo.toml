[workspace]
resolver = "2"
members = [
    "bin/claim",
    "bin/assemble",
    "bin/compact",
    "bin/model",
    "bin/parse",
    "bin/route",
    "bin/log",
    "bin/user",
    "bin/harness",
    "bin/hook-compact",
    "bin/hook-handoff",
    "bin/hook-goal-idle",
    "bin/hook-goal-compact",
    "bin/hook-goal-tools",
    "bin/hook-goal-arm",
    "tools/goal",
    "tools/goal_complete",
    "tools/goal_blocked",
    "tools/read",
    "tools/write",
    "tools/edit",
    "tools/list",
    "tools/bash",
    "bin/tui",
    "crates/common",
    "crates/goal-state",
]

[workspace.dependencies]
bon = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
libc = "0.2"
serde_json = "1.0"
toml = "0.7"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
