[model]
api = "responses"
max_output_tokens = 4096

[model.stub]
model_id = "stub-model"
base_url = "http://127.0.0.1:1"
api_key_env = "DUMMY"
context_tokens = 8000

[active]
model = "stub"

[paths]
sessions_root = "sessions"
tools_root = "/home/tony/programming/rust-unix-harness/tools"

[limits]
context_budget_tokens = 8000
compact_reserve_tokens = 500
compact_keep_tokens = 2000
compact_enabled = false

[system_prompt]
text = "test"

[hooks]
timeout_ms = 30000

[[hooks.on]]
window  = "run.idle"
command = "/home/tony/programming/rust-unix-harness/target/debug/harness-hook-goal-idle"
args    = []

[[hooks.on]]
window  = "compact.before"
command = "/home/tony/programming/rust-unix-harness/target/debug/harness-hook-goal-compact"
args    = []

[[hooks.on]]
window  = "tool.before"
command = "/home/tony/programming/rust-unix-harness/target/debug/harness-hook-goal-tools"
args    = []
