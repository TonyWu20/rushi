# House gate on push/PR: build + test + doc gate + e2e suites.
#
# Platform notes:
# - One job per flake supported system: x86_64-linux, aarch64-linux,
#   aarch64-darwin (Macs are a first-class dev platform).
# - Nix is installed via nix-installer-action on every platform.
# - The gate runs inside the flake devShell so the toolchain matches
#   the flake pin. All e2e scripts are hermetic (stub models, temp
#   dirs, no external service or key).
#
# Known scope notes:
# - scripts/cache-e2e.sh needs a machine-local config.toml and a live
#   DEEPSEEK_API_KEY, so it is not run here.
# - run-idle-continue-e2e.sh is owned by rushi-exts.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        # One entry per flake supported system. Nix builds for the
        # native arch on each runner.
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v1
        with:
          extra_nix_config: |
            experimental-features = "nix-command flakes"

      - name: Build the flake package
        run: nix build .#rushi --print-out-paths

      - name: Run tests and e2e suites in the flake devShell
        run: |
          set -e
          source <(nix print-dev-shell .)
          cargo test --workspace
          bash scripts/verify-specs.sh
          bash scripts/crash-e2e.sh
          bash scripts/compact-e2e.sh
          bash scripts/e2e-rewind.sh
          bash scripts/tool-conformance.sh
          bash scripts/model-before-transform-e2e.sh
          bash scripts/run-idle-log-message-e2e.sh
          bash scripts/run-idle-refire-e2e.sh
          bash scripts/steer-inflight-e2e.sh
          bash scripts/tool-after-transform-e2e.sh
