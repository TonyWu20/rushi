# House gate on push/PR: hermetic flake build + test + doc gate + e2e.
#
# One job per flake supported system (x86_64-linux, aarch64-linux,
# aarch64-darwin). Each runner builds natively, so `nix build .#rushi`
# proves the flake packages for that platform (the aarch64-darwin job is
# the "rushi works on Mac" gate).
#
# Test/e2e steps do NOT run inside the Nix devShell: Nix on the
# runners predates `nix develop . -- cmd` / `nix print-dev-shell`, so
# the toolchain comes from rustup (matches the flake's fenix stable
# pin) and the gate is still the same: build, test, doc gate, e2e.
#
# Tooling notes:
# - jq and python3 ship on the runners; ripgrep is installed.
# - `scripts/cache-e2e.sh` needs a machine-local config.toml plus a live
#   DEEPSEEK_API_KEY, so it stays a local key-gated test.
# - `run-idle-continue-e2e.sh` is owned by rushi-exts.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        # One entry per flake supported system.
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v1
        with:
          extra_nix_config: |
            experimental-features = "nix-command flakes"

      - name: Build the flake package (hermetic, native arch)
        run: nix build .#rushi --print-out-paths

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ripgrep + jq
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ripgrep jq

      - name: Install ripgrep + jq
        if: runner.os == 'macOS'
        run: brew install ripgrep jq

      - name: cargo build + test
        run: |
          cargo build --workspace
          cargo test --workspace

      - name: Doc gate
        run: bash scripts/verify-specs.sh

      - name: e2e: crash consistency
        run: bash scripts/crash-e2e.sh

      - name: e2e: compact
        run: bash scripts/compact-e2e.sh

      - name: e2e: rewind
        run: bash scripts/e2e-rewind.sh

      - name: e2e: tool conformance
        run: bash scripts/tool-conformance.sh

      - name: e2e: model-before transform
        run: bash scripts/model-before-transform-e2e.sh

      - name: e2e: run-idle log-message
        run: bash scripts/run-idle-log-message-e2e.sh

      - name: e2e: run-idle refire
        run: bash scripts/run-idle-refire-e2e.sh

      - name: e2e: steer-inflight
        run: bash scripts/steer-inflight-e2e.sh

      - name: e2e: tool-after transform
        run: bash scripts/tool-after-transform-e2e.sh
