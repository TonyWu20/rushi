# House gate on push/PR: build + test + doc gate + e2e suites.
#
# Platform notes:
# - Linux jobs build the flake natively (x86_64-linux / aarch64-linux).
# - The macOS arm64 runner (macos-14) covers aarch64-darwin. Nix on that
#   runner builds aarch64-darwin natively, so no cross toolchain is needed.
# - The gate is the same on all platforms: `cargo build --workspace`,
#   `cargo test --workspace`, `scripts/verify-specs.sh`, and the e2e
#   suites under scripts/. All of these are hermetic: they use stub
#   models and machine-local temp dirs, no external service or key.
# - `scripts/cache-e2e.sh` needs a live DEEPSEEK_API_KEY plus a local
#   config.toml, so it stays a manual / nightly job (opt-in here).
#
# Known gap: scripts/run-idle-continue-e2e.sh is owned by the
# rushi-exts repo (docs/tui-ext-repo-split.md section 4) and does not
# run here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        # One entry per flake supported system. Nix builds for the
        # native arch on each runner.
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (Linux)
        if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v1
        with:
          extra_nix_config: |
            experimental-features = "nix-command flakes"
          # Cache the store across runs so warm caches keep builds fast.
          extra_nix_config_env: |
            NIX_CONF_DIR = "${{ runner.temp }}/nix-conf"

      - name: Install Nix (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://determinate.systems/nix/latest/install.sh | bash
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build the flake package
        run: nix build .#rushi --print-out-paths

      - name: cargo test
        run: |
          # The devShell's rust is the flake-pinned toolchain; running
          # through `nix develop` matches local dev exactly.
          nix develop . -- cargo test --workspace

      - name: Doc gate
        run: nix develop . -- bash scripts/verify-specs.sh

      - name: e2e suites
        run: |
          nix develop . -- bash scripts/crash-e2e.sh
          nix develop . -- bash scripts/compact-e2e.sh
          nix develop . -- bash scripts/e2e-rewind.sh
          nix develop . -- bash scripts/tool-conformance.sh
          nix develop . -- bash scripts/model-before-transform-e2e.sh
          nix develop . -- bash scripts/run-idle-log-message-e2e.sh
          nix develop . -- bash scripts/run-idle-refire-e2e.sh
          nix develop . -- bash scripts/steer-inflight-e2e.sh
          nix develop . -- bash scripts/tool-after-transform-e2e.sh
