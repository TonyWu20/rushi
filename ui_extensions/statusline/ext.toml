# The reference statusline extension (ui-extension-plan stage 2).
# One process, tick-driven. The row is a powerline footer: rounded
# pill segments with Nerd Font glyphs (U+E0B6 caps, U+E0B4 arrows
# and end cap), each span carrying its own hex colors. The row
# shows:
# - the live dir (the config dir, where the TUI and loop operate)
# - git branch + dirty mark, TTL-cached at 3 s (the design's tick
#   cost note: no git spawn on every tick)
# - session, model, and loop state from the tick payload
# - cumulative usage summed over assistant_message and
#   compaction_summary usage events. The summary call's usage joins
#   the cumulative totals. It does not move the context fullness
#   metric: the ctx section reads the last assistant_message input
#   only. The host re-sends every usage-bearing event of the listed
#   kinds at start, so the totals survive a TUI restart from the
#   log alone
# - context fullness, the number to watch for compaction: the last
#   measured request input tokens over the model window, in the
#   starship-statusline style (`ctx <pct>% (<tokens>/<window>)`);
#   the window is the active model's context_tokens in $CONFIG
# Shared-UI-state `ext_status` values are not shown: they are host
# presentation (the input-area border, the working row), not
# statusline content (2026-09-02 revision; the `statuses` map stays
# on the tick payload for other consumers)
# Narrow terminals (< 100 cols) get the two-line layout. A row
# that overflows the terminal drops its lowest-priority pills.
[ext]
command = "bash"
args = ["statusline.sh"]
caps = ["status"]
kinds = ["assistant_message", "compaction_summary"]
tick_ms = 1000
protocol_v = 1
