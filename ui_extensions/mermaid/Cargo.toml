# The reference `mermaid` transform extension (ui-extension-plan
# stage 3). A standalone cargo package, not a member of the root
# workspace: the empty `[workspace]` table stops cargo from
# attaching it to the root.
#
# Build: `cargo build` here. The binary lands in
# ./target/debug/mermaid-ext. The manifest addresses it by a path
# relative to its own entry (`target/debug/mermaid-ext`); the host
# resolves that against the entry directory, so no `PATH` export is
# needed (docs/ui-extension.md section 3).

[package]
name = "mermaid-ext"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "mermaid-ext"
path = "src/main.rs"

[dependencies]
mermaid-text = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
