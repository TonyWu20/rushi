# The reference `mermaid` transform extension (ui-extension-plan
# stage 3). A small Rust binary on the `mermaid-text` crate (the
# plan's open items: a LaTeX renderer is the next one).
#
# The host extracts the `fence:mermaid` code blocks from message
# content and sends the fence body to this binary. A finished
# reply replaces the fence with the Unicode box-drawing art. A
# failed or over-wide render leaves the raw fence (per-op G5
# fallback).
#
# Build: `cargo build` in this directory. The package is standalone
# (not a member of the root workspace); the binary lands in
# ./target/debug/mermaid-ext. The host resolves the relative path
# against this entry's directory (docs/ui-extension.md section 6), so
# no `PATH` export is required for the global layer.

[ext]
command = "target/debug/mermaid-ext"
caps = ["transform"]
transform = ["fence:mermaid"]
protocol_v = 1
