# The `goal` commands extension for the TUI command palette
# (docs/goal-ux.md). Registers user-facing goal commands:
#   goal, goal_edit, goal_pause, goal_clear, goal_resume
#
# Event-driven goal setting (docs/goal-ux.md §1.1, §1.8):
# When the user selects `goal` or `goal_edit` from the palette, the
# extension arms an in-memory flag. The next `user_message` event
# forwarded by the TUI (via `kinds = ["user_message"]`) triggers a
# direct write to `goal.json` — no agent round-trip needed.
#
# The `model.before` hook reads `goal.json` on every model call and
# injects the cache-stable goal block (§1.1b/§1.1c).
#
# - `goal_pause` — sets `active = false` in goal.json; the loop stops
#   at the next `run.idle` window (§1.4).
# - `goal_clear` — deletes `goal.json` (irreversible, §1.4).
# - `goal_resume` — re-activates a closed goal, resets counters (§1.4).
#
# Row slot (docs/ui-extension.md section 4, `row` capability):
# The host reserves one row above the input box; this extension owns
# it. It renders the goal status line while a goal is open and the
# "goal armed" hint while a goal write/edit is pending. Without the
# extension installed, the bare TUI shows no such row (the TUI has
# no goal-state dependency).
#
# Build: `cargo build` in this directory. The package is standalone
# (not a member of the root workspace); the binary lands in
# ./target/debug/goal-ext. The manifest addresses it by a path
# relative to its own entry; the host resolves that against the entry
# directory (docs/ui-extension.md section 6), so no `PATH` export is
# required for the global layer.

[ext]
command = "target/debug/goal-ext"
caps = ["commands", "append", "row"]
append_types = ["ext_status"]
kinds = ["user_message"]
protocol_v = 1
