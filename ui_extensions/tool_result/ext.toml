# The reference tool_result renderer (ui-extension-plan stage 2).
#
# The `render` kind owner for `tool_result`. The host forwards every
# tool_result event; the script answers with a styled `lines` reply:
# a header line (tool id, exit status, error mark) plus the result
# body, one dim line per hard line of the text.
#
# If the script dies, the host drops the cached replies and the
# built-in render returns (ui-extension-plan stage 2 acceptance).

[ext]
command = "bash"
args = ["tool_result.sh"]
caps = ["render"]
kinds = ["tool_result"]
protocol_v = 1
