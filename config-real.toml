[model]
api = "responses"
max_output_tokens = 32768
reasoning_effort = "xhigh"
# Overall timeout in seconds for a single model request (responses and
# chat-completions). 0 disables the cap. Per-model `timeout_s` in a
# `[model.<name>]` table overrides this global value.
# model_timeout_s = 3600

[model."Qwen3.8-27B-NVFP4-RTX5090-DFlash2"]
model_id = "Qwen3.8-27B-NVFP4-RTX5090-DFlash2"
base_url = "http://127.0.0.1:30000"
api_key_env = "LLAMA_API_KEY"
context_tokens = 262144
vision = true

[active]
model = "Qwen3.8-27B-NVFP4-RTX5090-DFlash2"

[paths]
sessions_root = "sessions"
tools_root = "tools"
# Extension-provided tool manifests. In a kernel-only checkout the
# list is empty. When running alongside the rushi-exts sibling repo,
# uncomment the line below to scan its goal-app/goal-tools/ group
# (goal, goal_blocked, goal_complete) and the lean-verify tool.
# route/parse/assemble scan these roots after tools_root; the primary
# root wins a name collision. Tool binaries resolve on PATH from the exts build.
extra_tools_roots = ["../rushi-exts/goal-app/goal-tools/"]

# extra_tools_roots = ["../rushi-exts/goal-app/goal-tools", "../rushi-exts/lean-verify"]

# The TUI's global extension layer tree lives in `[tui] ext_dirs` below.
# In a kernel-only checkout there is no global layer. When running
# alongside the rushi-exts sibling repo, set `ext_dirs` in `[tui]`.

[limits]
# read_limit = 2000
# read_max_line_length = 2000
# read_max_bytes = 51200
# read_stream_min_size = 10485760
# write_max_bytes = 1048576
# tool_result_max_chars = 20000
# bash_max_output_bytes = 16000
# bash_timeout_default = 60
# bash_timeout_max = 300
compact_enabled = true
compact_reserve_tokens = 16384
compact_keep_tokens = 20000
compact_strategy = "compact"
context_budget_tokens = 262144 # default: context_tokens - max_output_tokens
# approval_timeout_s = 300             # absent: approval waits forever
# compact_reasoning_effort = "low"    # absent: inherit session effort

# Lifecycle hook registration (docs/loop-lifecycle-hooks.md 4.1).
# The on list is ordered. Each entry binds one hook command to one
# window. The harness fires the hooks in order at each window.
# timeout_ms bounds the hook lifetime; a timed-out hook is a
# non-blocking failure (the window default applies).
[hooks]
timeout_ms = 30000

# Example hook registrations (uncomment to enable):
[[hooks.on]]
window = "exhausted.handle"
command = "harness-hook-compact"

[[hooks.on]]
window = "overflow.resolve"
command = "harness-hook-compact"
args = []

# Goal-continuation hooks (pi-goal port, rushi-exts).
# Uncomment when the rushi-exts sibling repo is built and its hook
# binaries are on PATH.
[[hooks.on]]
window = "run.idle"
command = "../rushi-exts/goal-app/goal-hooks/hook-goal-idle/target/release/harness-hook-goal-idle"
args = []

[[hooks.on]]
window = "compact.before"
command = "../rushi-exts/goal-app/goal-hooks/hook-goal-compact/target/release/harness-hook-goal-compact"
args = []

[[hooks.on]]
window = "tool.before"
command = "../rushi-exts/goal-app/goal-hooks/hook-goal-tools/target/release/harness-hook-goal-tools"
args = []

[[hooks.on]]
window = "model.before"
command = "../rushi-exts/goal-app/goal-hooks/hook-goal-arm/target/release/harness-hook-goal-arm"
args = []

[[hooks.on]]
window = "tool.before"
command = "../rushi-exts/no-find-grep/target/release/harness-hook-no-find-grep"
args = []

[system_prompt]
# Borrowed from the pi coding agent default prompt.
# Adapted to this harness's tool set and task discipline.
# The tool list is generated by assemble from tools_root +
# extra_tools_roots (docs/system-prompt-generation.md D4); do not
# hand-maintain a tool list in this text.
text = """You are an expert coding assistant in `rushi`, a Unix agent harness.
You help the user by reading files, running commands, editing code,
and writing new files.

Codebase is the truth. @docs/ is the place for context documents, but they might be stale.
Always confirm any claim against the code and written docs.

Guidelines:
- Plan first. Split the task into steps before you code.
- Never silently decide anything on your own. Report and brief to the users what you find needs consideration and decisions.
- Actively bookkeeping user's decisions during the session to the local repo. Looks for where the documents are saved. If there is none, ask for user's opinion on creating one.
- Build and test after changes. Run the commands that prove the change.
- Prefer read, edit, and write over bash for file work.
- Use read to examine files instead of cat or sed.
- Use offset and limit to continue reading large files.
- Keep replies short. Show file paths clearly in your replies.
- Report to user by straight plain statement of what is done, how it matches
  the design spec, what behavior does your test expect.
"""

# ─── TUI-only sections (the harness does not read these) ──────────

# The opaque loop command the TUI spawns for each session
# (docs/tui.md section 2.3). `rushi run <session>` is the kernel's
# turn loop runner, resolved on PATH.
[loop]
command = "target/release/rushi"
args = ["run"]
arg_style = "append_session"

# Where the launcher finds the TUI binary (relative to this config file).
# Global UI-extension layer directories: later entries override earlier
# ones by extension name; an empty/absent list falls back to
# <config-dir>/ui_extensions (docs/ui-extension.md section 3).
[tui]
binary = "../rushi-tui-ratatui-widget-based/target/release/tui"
clipboard = "unnamed"
ext_dirs = [
  "../rushi-exts/ext-rs/statusline-rs/",
  "../rushi-exts/ext-rs/notify-rs/",
  "../rushi-exts/goal-app/goal-ext/",
]

[tui.tool_display]
preset = "opencode"
# preview_lines = 8
bash_collapsed_lines = 5
highlight_engine = "tree-sitter" # real syntax colors behind the diff/preview
expand_mode = "click" # focus-nearest auto-expand w/ smooth animation
anim_ms = 400 # transition + fade-in duration
diff_collapsed_lines = 12
