# The reference `notify` extension, Rust port (ui-extension-plan
# stage 4). The bash reference is ui_extensions/notify/.
#
# Build: `cargo build` in this directory (a standalone cargo
# package, not a member of the root workspace). Put
# ./target/debug on `PATH` so the host can resolve the
# `notify-ext` command.

[package]
name = "notify-ext"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "notify-ext"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
