# The reference tool_result renderer, Rust port
# (ui-extension-plan stage 4). The bash reference is
# ui_extensions/tool_result/.
#
# Build: `cargo build` in this directory (a standalone cargo
# package, not a member of the root workspace). Put
# ./target/debug on `PATH` so the host can resolve the
# `tool_result-ext` command.

[ext]
command = "tool_result-ext"
caps = ["render"]
kinds = ["tool_result"]
protocol_v = 1
