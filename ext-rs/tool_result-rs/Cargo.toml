# The reference `tool_result` extension, Rust port
# (ui-extension-plan stage 4). A standalone cargo package, not a
# member of the root workspace.
#
# Build: `cargo build` here. The binary lands in
# ./target/debug/tool_result-ext; put that directory on `PATH` so
# the TUI host can resolve the command from ext.toml.

[package]
name = "tool_result-ext"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "tool_result-ext"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
