# Opaque loop command the TUI supervises (docs/tui.md section 2.3).
# The TUI never sees the internals of this command; it starts it,
# streams its output, and stops it on request.
[loop]
command = "bash"
args = ["scripts/turn.sh"]
arg_style = "append_session"

[model]
api = "responses"
max_output_tokens = 32768
reasoning_effort = "xhigh"

[model.deepseek]
model_id = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
context_tokens = 131072

[model."Qwen3.8-27B-NVFP4-DFlash2"]
model_id = "Qwen3.8-27B-NVFP4"
base_url = "http://127.0.0.1:30000"
api_key_env = "LLAMA_API_KEY"
context_tokens = 262144

[model."Qwen3.8-27B-NVFP4-RTX5090-DSPARK"]
model_id = "Qwen3.8-27B-NVFP4-RTX5090-DSPARK"
base_url = "http://127.0.0.1:30000"
api_key_env = "LLAMA_API_KEY"
context_tokens = 262144

[active]
model = "Qwen3.8-27B-NVFP4-RTX5090-DSPARK"

[paths]
sessions_root = "sessions"
tools_root = "tools"

[limits]
# Cap the model request so auto-compact engages before the context
# reaches the zone where this model emits empty tool-call arguments
# (FT-008). The first schema-validation failure in sessions/better-ui
# appeared at 56.8k input tokens; none below 50k. The budget is in
# input tokens (correction 62): the token-only decision compares the
# measured usage.input_tokens growth against it. No char mechanism.
# No chars-per-token rate. No char budget knob.
context_budget_tokens = 55000
read_limit = 2000
read_max_line_length = 2000
read_max_bytes = 51200
read_stream_min_size = 10485760
write_max_bytes = 1048576
tool_result_max_chars = 20000
bash_max_output_bytes = 16000
bash_timeout_default = 60
bash_timeout_max = 300
# Auto-compact knobs (correction 62: the sticky cache-first form).
# The token budget engages the compact form once, at the base caps
# below. After that the compact form is sticky: the caps freeze,
# the keep window halves down to two, and the oldest step groups
# drop out. Each over-budget reading moves one lever: a keep
# halving, or a drop jump sized by the measured per-group savings.
# The levers never move back. The compact region re-renders only
# when a lever moves, so the request prefix stays byte-stable for
# the provider prefix cache in between. The lever state persists in
# the session dir as compact.json. When the drop count reaches its
# max and the estimate still outgrows the budget, the automatic
# handoff takes over: one cheap summarization call on the compacted
# log seeds a new session, and the TUI offers a one-key resume
# there (correction 57).
#
# The caps are the freeze values. They are coherent with the token
# budget: the compact request must fit under it. The 8000/2000
# values of the char era broke that coherence: the compact request
# outgrew both the budget and the provider window.
compact_keep_events = 24
compact_result_chars = 500
compact_text_chars = 200
# The output cap of the one handoff summary call. Cheap by default:
# the summary is a seed, not a report.
handoff_summary_max_tokens = 4096

[system_prompt]
# Borrowed from the pi coding agent default prompt.
# Adapted to this harness's tool set and task discipline.
text = """You are an expert coding assistant in a Unix agent harness.
You help the user by reading files, running commands, editing code,
and writing new files.

Available tools:
- read: Read file contents. Results carry line numbers.
- write: Create or overwrite files.
- edit: Make exact text replacements in a file.
- bash: Execute bash commands (builds, tests, git, file search).
- list: List the files in a directory.

The project can add custom tools to the list above.

Guidelines:
- Plan first. Split the task into steps before you code.
- Complete the steps until the task is done.
- Build and test after changes. Run the commands that prove the change.
- Do not stop with the work unfinished. State what remains and why.
- Prefer read, edit, and write over bash for file work.
- Use read to examine files instead of cat or sed.
- Use offset and limit to continue reading large files.
- Keep replies short. Show file paths clearly in your replies."""
