# config.toml — generated by `rushi setup` v0.1.0 (kernel commit: dev)
# Uncomment any option to override the distribution default.
#
[active]
# model = "deepseek"

[model]
# api = "responses"
# max_output_tokens = 32768
# reasoning_effort = "xhigh"
# model_timeout_s = 3600
# Per-model overrides, one section per model, e.g.:
# [model.my-model]
# model_id = "my-model"
# base_url = "http://127.0.0.1:8080"
# api_key_env = "MODEL_API_KEY"
# context_tokens = 131072
# timeout_s = 3600
# reasoning_effort = "medium"
# vision = true   # send image tool results to the model (default false)

[paths]
# sessions_root = "sessions"
# tools_root = "tools"
# extra_tools_roots = []

[limits]
# read_limit = 2000
# read_max_line_length = 2000
# read_max_bytes = 51200
# read_stream_min_size = 10485760
# write_max_bytes = 1048576
# tool_result_max_chars = 20000
# bash_max_output_bytes = 16000
# bash_timeout_default = 60
# bash_timeout_max = 300
# compact_enabled = true
compact_reserve_tokens = 16384
# compact_keep_tokens = 20000
# compact_strategy = "compact"
# context_budget_tokens = 262144      # default: context_tokens - max_output_tokens
# approval_timeout_s = 300             # absent: approval waits forever
# compact_reasoning_effort = "low"    # absent: inherit session effort

[hooks]
# timeout_ms = 30000
# Hook registrations, one [[hooks.on]] table per entry:
# [[hooks.on]]
# window  = "exhausted.handle"
# command = "harness-hook-compact"
#
# [[hooks.on]]
# window  = "overflow.resolve"
# command = "harness-hook-compact"

# [loop]
# Opaque loop command the TUI spawns for each session
# (docs/tui.md section 2.3). `rushi run <session>` is the
# kernel turn-loop runner, resolved on PATH.
# command = "rushi"
# args = ["run"]
# arg_style = "append_session"
#

# [system_prompt]
# text = "You are an expert coding assistant..."
#
# [tui]
# binary = "target/release/tui"   # path to the TUI binary the launcher spawns (relative to this config)
# color = "truecolor"              # force color level: truecolor, 256, 8, 16 (default: detect)
# color_scheme = "catppuccin macchiato"
#
# [tui.tool_display]
# preset = "opencode"
# preview_lines = 8
# bash_collapsed_lines = 5
# diff_collapsed_lines = 24
# expanded_preview_max_lines = 50
# diff_view = "auto"
