# Opaque loop command the TUI supervises (docs/tui.md section 2.3).
# The TUI never sees the internals of this command; it starts it,
# streams its output, and stops it on request.
[loop]
command = "rushi"
args = ["run"]
arg_style = "append_session"

[model]
api = "responses"
max_output_tokens = 32768
reasoning_effort = "xhigh"
# Overall timeout in seconds for a single model request (responses and
# chat-completions). 0 disables the cap. Per-model `timeout_s` in a
# `[model.<name>]` table overrides this global value.
# model_timeout_s = 3600

[model.deepseek]
model_id = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
context_tokens = 131072

[model."Qwen3.8-27B-NVFP4-DFlash2"]
model_id = "Qwen3.8-27B-NVFP4"
base_url = "http://127.0.0.1:30000"
api_key_env = "LLAMA_API_KEY"
context_tokens = 262144

[model."Qwen3.8-27B-NVFP4-RTX5090-DFlash2"]
model_id = "Qwen3.8-27B-NVFP4-RTX5090-DFlash2"
base_url = "http://127.0.0.1:30000"
api_key_env = "LLAMA_API_KEY"
context_tokens = 262144

[active]
model = "Qwen3.8-27B-NVFP4-RTX5090-DFlash2"

[paths]
sessions_root = "sessions"
tools_root = "tools"

[limits]
# The cap of the model request in input tokens. It matches the
# context window of the active model (the [model] context_tokens,
# 262144). `assemble` clamps it to the input budget: the window
# minus max_output_tokens (229376). The token-only decision compares
# the measured usage.input_tokens growth against it. No char
# mechanism. No chars-per-token rate. No char budget knob. The
# proactive compact trigger is the design of docs/auto-compact-plan.md.
context_budget_tokens = 262144
read_limit = 2000
read_max_line_length = 2000
read_max_bytes = 51200
read_stream_min_size = 10485760
write_max_bytes = 1048576
tool_result_max_chars = 20000
bash_max_output_bytes = 16000
bash_timeout_default = 60
bash_timeout_max = 300

# The in-session auto-compact (docs/auto-compact-plan.md).
# compact_enabled is the kill switch: it gates the threshold hook
# and the overflow compaction. Off sends the overflow path to the
# last-resort forced compaction.
# compact_reserve_tokens: the trigger sits at context_budget_tokens
# minus the reserve. The reserve is the headroom left for the next
# model response: keep it at least the expected response size, or
# the trigger fires too late and the response overflows the window.
# The pi default is 16384; 4096 pushes the trigger to 258048 but
# leaves less headroom than this model's 4-8k responses.
# The same value is the hard-trim backstop target
# (docs/auto-compact-plan.md 9.8): when a request's estimate
# exceeds the trigger level, the oldest step groups drop until the
# request fits; when even the framing alone exceeds it, the
# context_exhausted last-resort compaction takes over.
# compact_keep_tokens: the keep window of the compact cut.
compact_enabled = true
compact_reserve_tokens = 16384
compact_keep_tokens = 20000
compact_trigger_base = "context_budget"
# The context-overflow strategy (docs/phase-2-plan.md 3.2). The
# only shipped value is `compact`: in-session shadow compact. The
# key is a seam for future strategies.
compact_strategy = "compact"
# The awaiting_approval wait bound in seconds. Absent: the loop
# waits for the answer without limit. Set: on timeout the loop
# synthesizes a deny tool_result and continues.
# approval_timeout_s = 300
# compact_reasoning_effort: optional. The summary call's reasoning
# effort. A cheaper value cuts the summary latency on a local GPU.
# Omitted: the session effort stands.

# Lifecycle hook registration (docs/loop-lifecycle-hooks.md 4.1).
# The on list is ordered. Each entry binds one hook command to one
# window. The harness fires the hooks in order at each window.
# timeout_ms bounds the hook lifetime; a timed-out hook is a
# non-blocking failure (the window default applies).
[hooks]
timeout_ms = 30000
# Example hook registrations (uncomment to enable):
# [[hooks.on]]
# window  = "exhausted.handle"
# command = "harness-hook-compact"
#
# [[hooks.on]]
# window  = "overflow.resolve"
# command = "harness-hook-compact"
# args    = []

# Goal-continuation hooks (pi-goal port).
[[hooks.on]]
window = "run.idle"
command = "harness-hook-goal-idle"
args = []

[[hooks.on]]
window = "compact.before"
command = "harness-hook-goal-compact"
args = []

[[hooks.on]]
window = "tool.before"
command = "harness-hook-goal-tools"
args = []

[[hooks.on]]
window = "model.before"
command = "harness-hook-goal-arm"
args = []

[system_prompt]
# Borrowed from the pi coding agent default prompt.
# Adapted to this harness's tool set and task discipline.
text = """You are an expert coding assistant in `rushi`, a Unix agent harness.
You help the user by reading files, running commands, editing code,
and writing new files.

Available tools:
- read: Read file contents. Results carry line numbers.
- write: Create or overwrite files.
- edit: Make exact text replacements in a file.
- bash: Execute bash commands (builds, tests, git, file search).

The project can add custom tools to the list above.

Guidelines:
- Plan first. Split the task into steps before you code.
- Complete the steps until the task is done.
- Build and test after changes. Run the commands that prove the change.
- Do not stop with the work unfinished. State what remains and why.
- Prefer read, edit, and write over bash for file work.
- Use read to examine files instead of cat or sed.
- Use offset and limit to continue reading large files.
- Keep replies short. Show file paths clearly in your replies."""

[model.Qwen3.8-27B-NVFP4-RTX5090-DFlash2]
reasoning_effort = "max"

[tui.tool_display]
preset = "opencode"
preview_lines = 8
bash_collapsed_lines = 5
diff_collapsed_lines = 24
