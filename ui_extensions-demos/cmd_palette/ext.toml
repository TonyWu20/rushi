# The command-palette demo extension.
#
# Registers two commands and one setting through the `commands`
# cap. The host fetches the command list when the palette opens
# and invokes commands back through the `invoke` op.
#
# Opt in: point `[ext] dir` at this layer.

[ext]
command = "bash"
args = ["cmd_palette.sh"]
caps = ["commands"]
protocol_v = 1
