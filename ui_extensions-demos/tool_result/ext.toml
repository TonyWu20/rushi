# The tool_result render demo (the bash reference, ui-extension-plan
# stage 2). Not part of the default ui_extensions layer: the host's
# built-in tool-result render (box, fold, the Ctrl+O expand) owns
# tool_result in the default UX (the 2026-09-03 user report: the ext
# reply replaced the box, and the fold key had no effect on the read
# and edit results). Opt in: point `[ext] dir` at this layer.
#
# If the script dies, the host drops the cached replies and the
# built-in render returns (ui-extension-plan stage 2 acceptance).

[ext]
command = "bash"
args = ["tool_result.sh"]
caps = ["render"]
kinds = ["tool_result"]
protocol_v = 1
