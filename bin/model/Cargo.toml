[package]
name = "model"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "model"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["stream", "blocking"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.7"
url = "2.5.8"
clap = { version = "4.6.6", features = ["derive"] }
