[package]
name = "assemble"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "assemble"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.151"
toml = "0.7"
clap = { version = "4.6.6", features = ["derive"] }
chrono = "0.4"
bon = { workspace = true }
harness-common = { path = "../../crates/common" }

[dev-dependencies]
tempfile = "3"
