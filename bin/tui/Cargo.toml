[package]
name = "tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
tokio = { version = "1.53", features = ["process", "time", "rt-multi-thread", "macros", "sync", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
chrono = "0.4"
regex = "1.13"
toml = "1.1"
libc = "0.2"
bon = { workspace = true }

[dev-dependencies]
tempfile = "3"
