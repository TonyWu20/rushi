[tool]
description = "Formal-verification gate for Lean 4: init a lake project, run the zero-sorry lake build kernel check, translate a Rust crate to a Lean model (charon + aeneas), and differential-random-test a Lean model against production code. Spec-driven loop: write the Lean spec, prove it (build), follow the proven spec to implement the Rust (the spec is the contract), then regression-gate with drt. Self-documents the full workflow via --help."
command = "lean-verify"
args = []
# The internal build cap is 3h; the manifest backstop sits above it with
# margin (bash-tool.md section 2 pattern) so the tool's own timeout
# handler always completes before the route backstop fires.
timeout_ms = 11160000

[tool.schema]
type = "object"
required = ["op"]

[tool.schema.properties.op]
type = "string"
description = "Operation: 'init' create a lake project, 'build' run the zero-sorry lake build kernel gate, 'drt' differential random testing, 'check-inputs' preflight the DRT input protocol (report the lines the executables reject, without the full comparison), 'translate' translate a Rust crate to a Lean model via charon + aeneas."

[tool.schema.properties.name]
type = "string"
description = "init: name of the Lean package (the lake init target). Must match [A-Za-z][A-Za-z0-9_-]*."

[tool.schema.properties.dir]
type = "string"
description = "Project directory for 'init' (must be empty), 'build', and 'drt'; for 'translate', the cargo crate root (must contain Cargo.toml). Default: the session working directory."

[tool.schema.properties.cache]
type = "boolean"
description = "init: also run `lake exe cache get`. Skipped by default under Nix (prebuilt oleans come from the Nix store via LEAN_PATH); only needed in elan-managed environments."
default = false

[tool.schema.properties.model]
type = "string"
description = "drt: sh -c command for the Lean model executable. Receives each input as $1 and as the DRT_INPUT environment variable."

[tool.schema.properties.prod]
type = "string"
description = "drt: sh -c command for the production-code executable. Same input contract as model."

[tool.schema.properties.n]
type = "integer"
description = "drt/check-inputs: number of inputs. drt default 100000 (2000 when smoke is true); check-inputs default 2000. Max 1000000."
default = 100000

[tool.schema.properties.seed]
type = "integer"
description = "drt: seed of the deterministic built-in input generator. Default 42. Ignored when input_gen is set."
default = 42

[tool.schema.properties.bound]
type = "integer"
description = "drt: input range [0, bound) for the built-in generator. Default: full 64-bit range. Ignored when input_gen is set."

[tool.schema.properties.input_gen]
type = "string"
description = "drt: sh -c command that prints one input per line, overriding the built-in generator (up to n lines)."

[tool.schema.properties.stop_on_mismatch]
type = "boolean"
description = "drt: stop at the first mismatch. Default true. Set false to collect up to max_mismatches examples."
default = true

[tool.schema.properties.max_mismatches]
type = "integer"
description = "drt: number of mismatches to collect before stopping when stop_on_mismatch is false. Default 10."
default = 10

[tool.schema.properties.per_input_timeout_s]
type = "integer"
description = "drt/check-inputs: per-input command timeout in seconds. Default 30, max 300."
default = 30

[tool.schema.properties.smoke]
type = "boolean"
description = "drt/check-inputs: the quick tier. When n is not given, n=2000 (~15 s) instead of the full default. An explicit n still wins. The full tier gates the release; smoke is the one-liner quick check."
default = false

[tool.schema.properties.progress]
type = "boolean"
description = "drt: write the progress/heartbeat + checkpoint file <dir>/.drt-progress.json (every ~10 s or 100 inputs: pid, next index, rate, eta, updated_at; poll it to see whether a long run is alive; deleted on a clean run, kept on a stop). Default true for drt, false for check-inputs."

[tool.schema.properties.resume]
type = "boolean"
description = "drt/check-inputs: continue from the checkpoint file left by a stopped run (mismatch/timeout/reject), starting at the first failed index. The call must match the checkpoint's parameters and the input sequence must be deterministic. Default false."
default = false

[tool.schema.properties.max_rejections]
type = "integer"
description = "check-inputs: number of rejections to collect before stopping when stop_on_reject is false. Default 10, max 1000."
default = 10

[tool.schema.properties.stop_on_reject]
type = "boolean"
description = "check-inputs: stop at the first rejected input. Default true. Set false to collect up to max_rejections examples."
default = true
