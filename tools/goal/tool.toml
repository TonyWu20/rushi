[tool]
description = "Start a goal that the loop pursues across turns. The agent keeps working until the goal is completed or blocked."
command = "goal"
args = []
timeout_ms = 5000

[tool.schema]
type = "object"
required = ["goal"]

[tool.schema.properties]
[tool.schema.properties.goal]
type = "string"
description = "Description of the goal to pursue"

[tool.schema.properties.budget_tokens]
type = "integer"
description = "Optional token budget cap. When the budget is exhausted the loop stops continuing the goal."
