[tool]
description = "Start a goal that the loop pursues across turns. The agent keeps working until the goal is completed or blocked. There is no token budget."
command = "goal"
args = []
timeout_ms = 5000

[tool.schema]
type = "object"
required = ["goal"]

[tool.schema.properties]
[tool.schema.properties.goal]
type = "string"
description = "Description of the goal to pursue"
