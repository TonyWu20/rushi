[tool]
description = "Mark the active goal as blocked with a reason. The loop will stop continuing it."
command = "goal_blocked"
args = []
timeout_ms = 5000

[tool.schema]
type = "object"
required = ["reason"]

[tool.schema.properties]
[tool.schema.properties.reason]
type = "string"
description = "Why the goal cannot be completed (missing dependency, external system down, etc.)"
