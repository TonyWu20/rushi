[tool]
description = "Mark the active goal as complete. Call this when the goal is done; the loop will stop continuing it."
command = "goal_complete"
args = []
timeout_ms = 5000

[tool.schema]
type = "object"
required = ["goal_id"]

[tool.schema.properties]
[tool.schema.properties.goal_id]
type = "string"
description = "The exact goal_id from the goal prompt's <goal_id> block. A missing or mismatched id is rejected (stale-turn guard)."

[tool.schema.properties.summary]
type = "string"
description = "Optional summary of what was accomplished. Must not contradict the completion claim (e.g. 'not complete', 'still failing', 'because tests fail')."
